<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维特图片压缩转WebP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #f3f4f6;
            padding: 32px 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .upload-area {
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background-color: #f0f7ff;
        }
        .upload-area input {
            display: none;
        }
        .control-wrap {
            margin-top: 24px;
        }
        .row {
            display: flex;
            gap:12px;
            align-items:center;
            margin-bottom:16px;
            flex-wrap:wrap;
        }
        label {
            font-weight:500;
            color:#374151;
        }
        input[type="range"]{
            flex:1;
        }
        .btn {
            padding:10px 20px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:15px;
            cursor:pointer;
        }
        .btn:disabled{
            background:#94a3b8;
            cursor:not-allowed;
        }
        .preview-wrap{
            margin-top:28px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }
        .preview-card{
            border:1px solid #e5e7eb;
            border-radius:12px;
            padding:16px;
        }
        .preview-card h3{
            font-size:15px;
            margin-bottom:12px;
            color:#4b5563;
        }
        .preview-img{
            max-width:100%;
            max-height:320px;
            object-fit:contain;
        }
        .info-text{
            margin-top:10px;
            font-size:13px;
            color:#6b7280;
        }
        @media(max-width:640px){
            .preview-wrap{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>图片压缩 · 转为WebP</h1>

    <div class="upload-area" id="uploadBox">
        <p>点击或者拖拽图片到此处上传</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="control-wrap">
        <div class="row">
            <label>压缩质量：<span id="qualityVal">0.7</span></label>
            <input type="range" id="qualitySlider" min="0.1" max="1" step="0.05" value="0.7">
        </div>
        <div class="row">
            <button class="btn" id="compressBtn" disabled>开始压缩并导出WebP</button>
            <button class="btn" id="downloadBtn" disabled>下载WebP图片</button>
        </div>
    </div>

    <div class="preview-wrap">
        <div class="preview-card">
            <h3>原图</h3>
            <img class="preview-img" id="originImg">
            <div class="info-text" id="originInfo"></div>
        </div>
        <div class="preview-card">
            <h3>压缩后 WebP</h3>
            <img class="preview-img" id="compressedImg">
            <div class="info-text" id="compressedInfo"></div>
        </div>
    </div>
</div>

<script>
    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const compressBtn = document.getElementById('compressBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const originImg = document.getElementById('originImg');
    const compressedImg = document.getElementById('compressedImg');
    const originInfo = document.getElementById('originInfo');
    const compressedInfo = document.getElementById('compressedInfo');

    let originFile = null;
    let compressedBlob = null;

    // 更新质量显示
    qualitySlider.addEventListener('input', ()=>{
        qualityVal.textContent = qualitySlider.value;
    })

    // 点击上传
    uploadBox.addEventListener('click', ()=>fileInput.click());

    //拖拽上传
    uploadBox.addEventListener('dragover',e=>{
        e.preventDefault();
        uploadBox.style.borderColor="#2563eb";
    })
    uploadBox.addEventListener('dragleave',()=>{
        uploadBox.style.borderColor="#9ca3af";
    })
    uploadBox.addEventListener('drop',e=>{
        e.preventDefault();
        uploadBox.style.borderColor="#9ca3af";
        if(e.dataTransfer.files.length){
            handleFile(e.dataTransfer.files[0])
        }
    })

    fileInput.addEventListener('change',()=>{
        if(fileInput.files[0]) handleFile(fileInput.files[0]);
    })

    function formatSize(bytes){
        if(!bytes) return '';
        if(bytes <1024) return bytes+' B';
        if(bytes <1024*1024) return (bytes/1024).toFixed(2)+' KB';
        return (bytes/(1024*1024)).toFixed(2)+' MB';
    }

    function handleFile(file){
        if(!file.type.startsWith('image/')){
            alert("请选择图片文件");
            return;
        }
        originFile = file;
        compressedBlob = null;
        downloadBtn.disabled=true;

        const reader = new FileReader();
        reader.onload = e=>{
            originImg.src = e.target.result;
            originInfo.innerText = `文件:${file.name} | 大小:${formatSize(file.size)}`;
            compressBtn.disabled = false;
            compressedImg.src = '';
            compressedInfo.innerText = '';
        }
        reader.readAsDataURL(file);
    }

    //压缩转webp
    compressBtn.addEventListener('click',async ()=>{
        if(!originFile) return;
        compressBtn.disabled=true;
        compressBtn.innerText="处理中...";

        const img = new Image();
        img.src = URL.createObjectURL(originFile);
        await new Promise(resolve=>img.onload=resolve);

        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0);

        //输出webp blob
        const quality = Number(qualitySlider.value);
        canvas.toBlob((blob)=>{
            compressedBlob = blob;
            compressedImg.src = URL.createObjectURL(blob);
            compressedInfo.innerText = `格式:WebP | 大小:${formatSize(blob.size)}`;
            downloadBtn.disabled = false;
            compressBtn.disabled = false;
            compressBtn.innerText="开始压缩并导出WebP";
        },'image/webp',quality);
    })

    //下载
    downloadBtn.addEventListener('click',()=>{
        if(!compressedBlob) return;
        const a = document.createElement('a');
        const url = URL.createObjectURL(compressedBlob);
        a.href = url;
        //修改后缀为webp
        const baseName = originFile.name.replace(/\.[^.]+$/,'');
        a.download = baseName+'.webp';
        a.click();
        URL.revokeObjectURL(url);
    })
</script>
</body>
</html>
